{% extends 'boards/base.html' %}
{% block title %}Home{% endblock %}
{% block css %} 
<style>
        /* General reset */
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }
    
        h1 {
            text-align: center;
            margin: 20px 0;
            color: #333;
        }
    
        /* Masonry container */
        .masonry {
            column-count: 4; /* Default for larger screens */
            column-gap: 18px;
        }
    
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 18px;
        }
    
        .masonry-item img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }
    
        .masonry-item img:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
        }
    
        /* Responsive Design */
        @media (max-width: 768px) {
            .masonry {
                column-count: 3; /* Medium screens: 3 images per row */
            }
        }
    
        @media (max-width: 576px) {
            .masonry {
                column-count: 2; 
            }
        }
</style>
{% endblock %}

{% block body %} 
{% load static %}
<div class="container mt-5">
    <div class="masonry">
        {% for image1 in images %}
        <div class="masonry-item">
            <!-- Wrap the image with a link to the pin detail page -->
            <a href="{% url 'pin-view' image_id=image1.image_id %}">
                <img src="{{ image1.image.url }}" alt="Image" id="{{ image1.image_id }}">
            </a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
