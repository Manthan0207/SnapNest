<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | MyApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f0f0f0;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 10px;
        }
        
        .logo img {
            width: 50px;
        }
        
        .signup-container {
            width: 100%;
            max-width: 450px;
        }
        
        .card {
            padding: 1.2rem;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            background-color: white;
        }
        
        .signup-box h3 {
            color: #333;
            font-weight: 600;
            text-align: center;
            font-size: 18px;
        }
        
        .form-label {
            font-weight: 500;
            font-size: 13px;
        }
        
        .form-control {
            border-radius: 6px;
            padding: 7px;
            font-size: 13px;
            border: 1px solid #ccc;
            margin-top: 4px;
        }
        
        .form-control:focus {
            border-color: #6dd5ed;
            outline: none;
        }
        
        .btn-primary {
            background-color: #e60023;
            border: none;
            padding: 8px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .btn-primary:hover {
            background-color: #c2001d;
        }
        
        .mt-3 a {
            color: #e60023;
            text-decoration: none;
            font-size: 13px;
        }
        
        .mt-3 a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    {% load static %}
    <div class="logo">
        <img src="{% static 'boards/images1.png' %}" alt="Logo" width="100">
    </div>
    <div class="signup-container">
        <div class="card shadow-lg p-3 rounded">
            <h3 class="mb-3 text-center">Create an Account</h3>
            {% if messages %}
                <div class="alert alert-danger">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
            <form method="post" action="/boards/signup/">
                {% csrf_token %}
                <div class="mb-2">
                    <label for="fname" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="fname" name="fname" placeholder="First Name" required>
                </div>
                <div class="mb-2">
                    <label for="lname" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="lname" name="lname" placeholder="Last Name" required>
                </div>
                <div class="mb-2">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                </div>
                <div class="mb-2">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                </div>
                <div class="mb-2">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="pass1" placeholder="Password" required>
                </div>
                <div class="mb-2">
                    <label for="password2" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="password2" name="pass2" placeholder="Confirm Password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign Up</button>
            </form>
            <div class="mt-3 text-center">
                <p>Already have an account? <a href="/boards/login-page">Log In</a></p>
            </div>
        </div>
    </div>
</body>
</html>
