<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MyApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f5f5;
        }
        
        .login-container {
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        
        .logo {
            margin-bottom: 20px;
        }
        
        .login-box {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
        }
        
        .login-box h2 {
            margin-bottom: 20px;
            font-weight: 600;
            color: #333;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .input-group label {
            font-weight: 500;
            font-size: 14px;
            color: #333;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #e60023;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .login-btn:hover {
            background: #c2001d;
        }
        
        .forgot-password, .signup-prompt {
            margin-top: 10px;
            font-size: 14px;
        }
        
        .forgot-password a, .signup-prompt a {
            color: #e60023;
            text-decoration: none;
            font-weight: 500;
        }
        
        .forgot-password a:hover, .signup-prompt a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    {% load static %}
    <div class="login-container">
        <div class="logo">
            <img src="{% static 'boards/images1.png' %}" alt="Logo" width="100">
        </div>
        <div class="login-box">
            <h2>Log in to SnapNest</h2>
            {% if messages %}
            <div class="alert">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}
            <form method="post" action="/boards/login/">
                {% csrf_token %}
                <div class="input-group">
                    <label for="email">Username</label>
                    <input type="text" id="email" name="login-username" placeholder="Enter your username" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="pass" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="login-btn">Log In</button>
            </form>
            <div class="forgot-password">
                <a href="#">Forgot your password?</a>
            </div>
            <div class="signup-prompt">
                <p>Don't have an account? <a href="/boards/signupPage">Sign Up</a></p>
            </div>
        </div>
    </div>
</body>
</html>
